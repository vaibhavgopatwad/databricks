resources:
  jobs:
    ingestion_job:
      name: ingestion_job
      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../../src/Notebooks/ingestion.ipynb
            base_parameters:
              catalog_name: assetbundles
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
