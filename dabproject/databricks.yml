# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: d210a28b-6c7c-4f65-b45f-b8e87a8d2050

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets: 
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://adb-7405618685709695.15.azuredatabricks.net
    variables:
      catalog: ${var.catalog_name}
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405605777092236.16.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/iconsultant1411@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/iconsultant1411@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
